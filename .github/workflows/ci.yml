name: CI

# Fast checks on every push and pull request: JS syntax, app and relay tests, Hermes plugin tests.
# Installers are built only by release.yml, which also calls this workflow as its test gate.
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

# github.workflow is the caller's name when release.yml calls this file, so a release's test gate never
# cancels (or is cancelled by) the ordinary CI run of the same commit. Only pull request runs cancel each other:
# a push run scans just its own before..after range, so cancelling one would leave those commits unscanned.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  js:
    name: JS syntax + app/relay tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            relay/package-lock.json

      - name: node --check (app + relay + push)
        run: |
          find app relay push -name '*.js' -not -path '*/node_modules/*' -not -path '*/dist/*' -print0 \
            | xargs -0 -n1 node --check
          echo "node --check passed for $(find app relay push -name '*.js' -not -path '*/node_modules/*' -not -path '*/dist/*' | wc -l) files"

      # The app's tests load teleproto (the Telegram serializers), so its dependencies are installed. That also
      # checks the lockfile and the postinstall step on Linux, and lets the relay's CDP tests drive the app's
      # own tunnel half (app/main/cdp-tunnel.js) instead of their stand-in. Electron 44+ downloads no binary here.
      # The app's browser-transfer fixture also loads the relay, so install both before testing either.
      - name: Install relay dependencies
        working-directory: relay
        run: npm ci

      - name: App tests
        working-directory: app
        run: |
          npm ci
          npm test

      - name: Relay tests
        working-directory: relay
        run: npm test


  plugin:
    name: Hermes plugin tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # the installer edits config.yaml with PyYAML, which Hermes' own Python always has
      - name: PyYAML
        run: python -m pip install pyyaml

      - name: hermes-deck plugin tests
        working-directory: hermes-plugin/hermes-deck
        run: python -m unittest discover -p 'test_*.py'

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan PR diff or pushed commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          range="$HEAD_SHA"
          # A force push (e.g. a rewritten history) has a "before" commit this clone does not contain: scan HEAD's history.
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            range="$BASE_SHA..$HEAD_SHA"
          fi
          # Trust only the read-only checkout mount, even when container and runner owners differ.
          # Gitleaks can exit zero on a git read error, so require an error-free scan log as well.
          docker run --rm -v "$PWD:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --config /repo/.gitleaks.toml --redact --log-opts="$range" \
            2>&1 | tee "$RUNNER_TEMP/gitleaks.log"
          if grep -q 'ERR' "$RUNNER_TEMP/gitleaks.log"; then
            echo '::error::Gitleaks could not scan the requested commits.'
            exit 1
          fi
      # Maintainers can keep their own identifiers (names, hosts, addresses) out of the history without publishing
      # them: one extended regex per line in the PRIVATE_DENYLIST secret. Without the secret (forks) this is skipped.
      # A match reports the commit and file:line only, never the matched text.
      - name: Private denylist (optional)
        env:
          DENY: ${{ secrets.PRIVATE_DENYLIST }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${DENY:-}" ]; then echo "No PRIVATE_DENYLIST secret; skipped."; exit 0; fi
          printf '%s\n' "$DENY" | grep -v '^#' | grep -v '^[[:space:]]*$' > "$RUNNER_TEMP/deny" || true
          range="$HEAD_SHA"
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            range="$BASE_SHA..$HEAD_SHA"
          fi
          fail=0
          for c in $(git rev-list "$range"); do
            short=$(git rev-parse --short "$c")
            if git log -1 --format='%an%n%ae%n%cn%n%ce%n%B' "$c" | grep -qiEf "$RUNNER_TEMP/deny"; then
              echo "::error::$short: the commit author, committer or message matches the private denylist."; fail=1
            fi
            git show --format= --no-color -U0 "$c" | awk -v c="$short" '
              /^\+\+\+ b\// { f = substr($0, 7); next }
              /^@@/ { split($3, a, ","); n = substr(a[1], 2) + 0; next }
              /^\+/ { print c ": " f ":" n "\t" substr($0, 2); n++ }' > "$RUNNER_TEMP/added"
            if cut -f2- "$RUNNER_TEMP/added" | grep -qiEf "$RUNNER_TEMP/deny"; then
              while IFS=$'\t' read -r where text; do
                if printf '%s\n' "$text" | grep -qiEf "$RUNNER_TEMP/deny"; then echo "::error::$where matches the private denylist."; fi
              done < "$RUNNER_TEMP/added"
              fail=1
            fi
          done
          exit $fail

  hygiene:
    name: Public content and file sizes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Public content checker tests
        run: python3 -m unittest discover -s scripts -p 'test_check_public.py'
      - name: Check tracked public content
        run: bash scripts/check-public.sh
