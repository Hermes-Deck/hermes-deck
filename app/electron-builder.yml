# Installers for people who just want to run Hermes Deck (G3). From app/:
#   npm run dist:win   Windows x64: NSIS installer (per user, no admin) + portable zip
#   npm run dist:mac   macOS arm64 + x64: dmg + zip, ad-hoc signed (no Apple Developer ID)
#   npm run dist       the targets of the current OS
# Each script copies the fonts first and writes dist/SHA256SUMS.txt last. Release builds run in
# .github/workflows/release.yml.
appId: io.github.hermes-deck # also the Windows AppUserModelID: main/desktop.js uses the same value
productName: Hermes Deck # installer, exe and shortcut names; the runtime name (and so the settings
# folder, %APPDATA%\hermes-deck) stays package.json "name", the same as a dev checkout
copyright: Copyright © 2026 Hermes Deck contributors

directories:
  output: dist
  buildResources: build

# Only what the app runs. electron-builder adds the production node_modules itself; scripts/, dist/ and
# everything outside app/ (relay, plugin, docs) never ship.
files:
  - main/**
  - renderer/** # includes renderer/fonts + fonts.css, generated by scripts/copy-fonts.js
  - build/icon.png # window, tray and toast icon at runtime (build/ is not packed by default)
  - "!**/*.{test,spec}.js"
  - "!**/{test,tests,__tests__}/**"
  - "!**/*.map"
  # third-party files nothing reads at runtime (license files stay)
  - "!**/node_modules/**/{docs,doc,example,examples}/**"
  - "!**/node_modules/**/*.{c,cc,cpp,h,gyp,gypi}"
  - "!**/node_modules/**/.*"

asar: true
npmRebuild: false # the only native modules (bufferutil, utf-8-validate) ship N-API prebuilds
electronLanguages: [en-US, tr] # Chromium UI strings; the deck's own text is in renderer/
publish: null # no update feed, so no repository details are written into the app

# Hardening: the packaged app runs only its own asar and ignores NODE_OPTIONS, --inspect and
# ELECTRON_RUN_AS_NODE, so nothing can attach to the main process that holds the Telegram session.
# (ELECTRON_RUN_AS_NODE is used only by the dev screenshot mode --bridge-fake, whose test/ helper never
# ships; the real bridge starts ssh, python or wsl, and agent browsers start the system Chrome/Edge.)
# Security audit L8: with onlyLoadAppFromAsar, ASAR integrity validation makes a tampered app.asar fail to
# load (Windows: Electron 30+, hash written into the exe's resources; macOS: into Info.plist; electron-builder
# 26 computes it). Cookie encryption: the deck itself keeps no cookies worth reading (agent browsers are
# separate Chrome/Edge profiles), so turning it on costs nothing; it is one-way, which is fine here.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  enableCookieEncryption: true

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  artifactName: Hermes-Deck-${version}-win-${arch}.${ext}

nsis:
  oneClick: true # no wizard: installs to %LOCALAPPDATA%\Programs\hermes-deck and starts the app
  perMachine: false
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true # carries the AppUserModelID that Windows toasts need
  shortcutName: Hermes Deck
  deleteAppDataOnUninstall: false # settings and the encrypted Telegram session stay; README says how to remove them
  differentialPackage: false # no auto-update, so no .blockmap
  packElevateHelper: false # elevate.exe only serves per-machine auto-updates
  include: build/installer.nsh
  artifactName: Hermes-Deck-${version}-Setup.${ext}

mac:
  icon: build/icon.png
  category: public.app-category.productivity
  extendInfo:
    NSUserNotificationAlertStyle: alert # signed macOS builds expose native action buttons
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  identity: "-" # ad-hoc signature: Apple Silicon refuses to run unsigned code; Gatekeeper still asks once
  hardenedRuntime: false # only needed for notarization, and it breaks ad-hoc library validation
  gatekeeperAssess: false
  notarize: false
  artifactName: Hermes-Deck-${version}-mac-${arch}.${ext}

dmg:
  writeUpdateInfo: false
