title = "Hermes Deck public source scan"

[extend]
useDefault = true

# Python bytecode is generated, gitignored and duplicates the scanned source fixtures.
[[allowlists]]
description = "Generated Python bytecode, never release source"
paths = ['''(?:^|/)__pycache__/''', '''\.pyc$''']

# Scope fake credentials to their specific test paths AND detection rules.
# All other rules remain active in these files; production files are never exempted.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Synthetic redaction inputs, idempotency keys and WebSocket handshake fixtures"
paths = [
  '''(?:^|/)hermes-plugin/hermes-deck/test_events\.py$''',
  '''(?:^|/)hermes-plugin/hermes-deck/test_bridge\.py$''',
  '''(?:^|/)app/test/bridge\.test\.js$''',
  '''(?:^|/)app/test/spaces\.test\.js$''',
  '''(?:^|/)relay/test/spaces\.test\.js$''',
  '''(?:^|/)relay/test/space-tunnel\.test\.js$''',
]

[[rules]]
id = "jwt"
[[rules.allowlists]]
description = "Public example JWT used to exercise secret redaction"
paths = ['''(?:^|/)relay/test/relay\.test\.js$''', '''(?:^|/)hermes-plugin/hermes-deck/test_events\.py$''']

[[rules]]
id = "curl-auth-header"
[[rules.allowlists]]
description = "Fake bearer values used to exercise redaction"
paths = ['''(?:^|/)relay/test/relay\.test\.js$''', '''(?:^|/)hermes-plugin/hermes-deck/test_events\.py$''']

[[rules]]
id = "private-key"
[[rules.allowlists]]
description = "Synthetic private-key-shaped redaction fixture, not a signing key"
paths = ['''(?:^|/)relay/test/relay\.test\.js$''']
